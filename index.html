<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shizuku — a single-player, Mudae-inspired character gacha. Collect kakigori."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bakbak+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Shizuku — collect kakigori</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        background: #070b12;
        color: #93a6bb;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      #boot .boot-drop {
        width: 16px;
        height: 16px;
        border-radius: 50% 50% 50% 2px;
        transform: rotate(45deg);
        background: linear-gradient(150deg, #f2fbff, #9ad9ff 45%, #3f8fc4);
        box-shadow: 0 0 16px rgba(154, 217, 255, 0.6);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: rotate(45deg) scale(1.15);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-drop"></div>
      <p>loading roster</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
